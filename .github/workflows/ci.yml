name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: IUCLabs/workflows/.github/workflows/pre-commit.yml@v0.1.0
    permissions:
      contents: read
    with:
      go_version_file: go.mod

  actions:
    uses: IUCLabs/workflows/.github/workflows/actions.yml@v0.1.0
    permissions:
      contents: read

  go:
    uses: IUCLabs/workflows/.github/workflows/go-ci.yml@v0.1.0
    permissions:
      contents: read
      pull-requests: read
    with:
      golangci_lint_version: v2.15.0
      # existing findings predate this job; gate new code only
      golangci_lint_only_new_issues: true
      # no docker on the runner, so testcontainers tests skip
      test_args: -count=1 ./pkg/... ./internal/...
      strip: false

  image:
    uses: IUCLabs/workflows/.github/workflows/release-go-image.yml@v0.1.0
    # the called job declares packages: write for the push; push: false uses none of it
    permissions:
      contents: read
      packages: write
    with:
      push: false
      runs_on: ubuntu-latest

  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /ui
