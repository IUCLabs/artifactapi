name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iuclabs-dind
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # runner image has no make: keep in sync with `make e2e`
      - run: go test -tags=e2e -count=1 -timeout=15m -v ./e2e/... 2>&1 | tee e2e.log
        shell: bash
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - if: failure()
        run: docker ps -a > docker-ps.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            e2e.log
            docker-ps.log
          retention-days: 7
