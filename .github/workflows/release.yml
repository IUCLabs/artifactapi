name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

jobs:
  release:
    uses: IUCLabs/workflows/.github/workflows/release-go-image.yml@v0.1.0
    permissions:
      contents: read
      packages: write

  ui:
    needs: release
    runs-on: iuclabs-release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/iuclabs/artifactapi-ui
      BASE_PATH: /ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
        env:
          GOTOOLCHAIN: auto
      - run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci && npm run build
        working-directory: ui
      - run: scripts/ui-image.sh "${IMAGE}:${GITHUB_REF_NAME}"
      - run: crane tag "${IMAGE}:${GITHUB_REF_NAME}" latest
