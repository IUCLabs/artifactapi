when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-api
    image: artifactapi.example.com/docker-internal/plugin-docker-buildx:latest
    settings:
      registry: artifactapi.example.com
      repo: artifactapi.example.com/docker-internal/artifactapi
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      tags:
        - ${CI_COMMIT_TAG}
        - latest
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 4Gi
            cpu: 2

  - name: docker-web
    image: artifactapi.example.com/docker-internal/plugin-docker-buildx:latest
    settings:
      registry: artifactapi.example.com
      repo: artifactapi.example.com/docker-internal/artifactapi-ui
      dockerfile: ui/Dockerfile.ui
      context: ui
      build_args:
        BASE_PATH: /ui
      tags:
        - ${CI_COMMIT_TAG}
        - latest
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 4Gi
            cpu: 2
