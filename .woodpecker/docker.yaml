when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-api
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.example.com
      repo: registry.example.com/example/artifactapi
      username: droneci
      password:
        from_secret: DRONECI_PASSWORD
      tags:
        - ${CI_COMMIT_TAG}
        - latest

  - name: docker-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.example.com
      repo: registry.example.com/example/artifactapi-ui
      dockerfile: ui/Dockerfile.ui
      context: ui
      build_args:
        BASE_PATH: /ui
      username: droneci
      password:
        from_secret: DRONECI_PASSWORD
      tags:
        - ${CI_COMMIT_TAG}
        - latest
