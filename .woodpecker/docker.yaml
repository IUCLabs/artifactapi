when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.example.com
      repo: registry.example.com/example/artifactapi
      username: droneci
      password:
        from_secret: DRONECI_PASSWORD
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      build_args:
        - VERSION=${CI_COMMIT_TAG##v}
