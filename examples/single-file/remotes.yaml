virtuals:
  helm-all:
    package: "helm"
    description: "Virtual repository merging all helm remotes — member order is priority order for duplicate chart+version"
    members:
      - hashicorp-helm
      - metallb
      - jetstack
      - rancher-stable
      - purelb
      - istio
      - cnpg
      - ceph-csi
